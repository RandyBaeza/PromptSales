version: "3.9"

services:
  api:
    build: .
    command: npm run start:dev
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_NAME: campaigns
      DB_USER: dev
      DB_PASS: devpass
      REDIS_HOST: redis
      S3_BUCKET: local-bucket
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
      - s3

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: campaigns
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  s3:
    image: lphoward/fake-s3
    ports:
      - "4569:4569"
