name: CD - Deploy to EKS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t campaigns-api .
          docker tag campaigns-api:latest ${{ secrets.ECR_REGISTRY }}/campaigns-api:latest

      - name: Push image
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/campaigns-api:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/campaigns-api campaigns-api=${{ secrets.ECR_REGISTRY }}/campaigns-api:latest
          kubectl rollout status deployment/campaigns-api
