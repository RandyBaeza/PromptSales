name: CD - Deploy to EKS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t api .
          docker tag api:latest ${{ secrets.ECR_REGISTRY }}/api:latest
          docker push ${{ secrets.ECR_REGISTRY }}/api:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Run DB migrations in cluster
        run: |
          echo "Applying migration job..."
          kubectl apply -f k8s/migration-job.yml

          echo "Waiting for migration job to complete..."
          kubectl wait --for=condition=complete job/run-migrations --timeout=180s

          echo "Deleting migration job..."
          kubectl delete job run-migrations --ignore-not-found=true

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/campaigns-api campaigns-api=${{ secrets.ECR_REGISTRY }}/api:latest
          kubectl rollout status deployment/campaigns-api
